# Local stack: API, PostgreSQL, Redis, and a Celery worker with beat for the overdue-rentals task.
x-app: &app
  build: .
  env_file: .env.example
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    <<: *app
    command: celery -A library worker --beat -l info
